<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc">
<title id="title">What a useful risk finding contains</title><desc id="desc">Upsun Dispatch shipping-feature review. Paraphrased scenario, not independently reproduced.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="990" rx="12" fill="#0b0f10"/>
<text x="44" y="42" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">G/</text>
<text x="101" y="40" fill="#b0babc" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="500" text-anchor="start">AI SOFTWARE FACTORY</text>
<text x="1156" y="40" fill="#b0babc" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="500" text-anchor="end">05 / 12</text>
<text x="44" y="104" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="650" text-anchor="start">What a useful risk finding contains</text>
<text x="44" y="145" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Upsun Dispatch shipping-feature review. Paraphrased scenario, not independently reproduced.</text>
<line x1="44" y1="170" x2="1156" y2="170" stroke="#3b4648" stroke-width="1"/>
<rect x="44" y="193" width="325" height="30" rx="15" fill="#0b0f10" stroke="#ae9cff" stroke-width="1"/>
<text x="56" y="214" fill="#ae9cff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="start">AGENT · PREPARES THE FINDING</text>
<rect x="44" y="244" width="1112" height="69" rx="9" fill="#171d1e" stroke="#3b4648" stroke-width="1.5"/>
<text x="65" y="279" fill="#ae9cff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" text-anchor="start">01</text>
<text x="110" y="279" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start">Concern</text>
<text x="380" y="279" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">The bar&#x27;s tax treatment differs from the carrier&#x27;s rule.</text>
<rect x="44" y="323" width="1112" height="69" rx="9" fill="#171d1e" stroke="#3b4648" stroke-width="1.5"/>
<text x="65" y="358" fill="#ae9cff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" text-anchor="start">02</text>
<text x="110" y="358" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start">Triggering condition</text>
<text x="380" y="358" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Tax-inclusive store, threshold 50, cart above 50 with tax.</text>
<rect x="44" y="402" width="1112" height="95" rx="9" fill="#171d1e" stroke="#3b4648" stroke-width="1.5"/>
<text x="65" y="437" fill="#ae9cff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" text-anchor="start">03</text>
<text x="110" y="437" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start">Possible consequence</text>
<text x="380" y="437" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">The carrier grants free shipping while the bar says 90%</text>
<text x="380" y="466" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">and asks the shopper to add $4.55 more.</text>
<rect x="44" y="507" width="1112" height="95" rx="9" fill="#171d1e" stroke="#3b4648" stroke-width="1.5"/>
<text x="65" y="542" fill="#ae9cff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" text-anchor="start">04</text>
<text x="110" y="542" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start">Code location</text>
<text x="380" y="542" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">The progress calculation and its threshold comparison.</text>
<text x="380" y="571" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">The review traces carrier and quote-address logic.</text>
<rect x="44" y="612" width="1112" height="95" rx="9" fill="#171d1e" stroke="#3b4648" stroke-width="1.5"/>
<text x="65" y="647" fill="#ae9cff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" text-anchor="start">05</text>
<text x="110" y="647" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start">Reported evidence</text>
<text x="380" y="647" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Review scenario uses 45.45 excluding tax, 54.54 including.</text>
<text x="380" y="676" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">The bar uses the tax-exclusive amount for its comparison.</text>
<rect x="44" y="717" width="1112" height="95" rx="9" fill="#171d1e" stroke="#3b4648" stroke-width="1.5"/>
<text x="65" y="752" fill="#ae9cff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" text-anchor="start">06</text>
<text x="110" y="752" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start">Unresolved question</text>
<text x="380" y="752" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Can the engineer reproduce the reported tax-mode case?</text>
<text x="380" y="781" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Which calculation matches the configured carrier rule?</text>
<rect x="44" y="840" width="546" height="89" rx="9" fill="#171d1e" stroke="#d6fa00" stroke-width="1.5"/>
<text x="65" y="869" fill="#d6fa00" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="start">SEVERITY · HOW BAD IF IT HAPPENS?</text>
<text x="65" y="905" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">The bar contradicts available free shipping.</text>
<rect x="610" y="840" width="546" height="89" rx="9" fill="#171d1e" stroke="#d6fa00" stroke-width="1.5"/>
<text x="632" y="869" fill="#d6fa00" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="start">CONFIDENCE · WHAT IS ESTABLISHED?</text>
<text x="632" y="905" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Reported scenario. Reproduction still needed.</text>
<line x1="44" y1="932" x2="1156" y2="932" stroke="#3b4648" stroke-width="1"/>
<text x="44" y="959" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">HUMAN · The engineer judges the consequence and the remaining uncertainty.</text>
</svg>