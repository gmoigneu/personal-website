<text x="67" y="254" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="start">13 files reviewed · 1 warning · 3 minor points · 1 nitpick</text>
<text x="45" y="314" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start">DISPATCH LABEL · WARNING</text>
<rect x="44" y="334" width="536" height="148" rx="9" fill="#171d1e" stroke="#ae9cff" stroke-width="1.5"/>
<text x="66" y="369" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" text-anchor="start">Tax rules diverge</text>
<text x="66" y="411" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">The carrier includes tax in this case.</text>
<text x="66" y="441" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">The progress bar excludes it.</text>
