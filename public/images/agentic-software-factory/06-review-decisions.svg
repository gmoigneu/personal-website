<text x="642" y="369" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" text-anchor="start">Optional bar, wider failure</text>
<text x="642" y="411" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">An unguarded getData() exception</text>
<text x="642" y="441" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">can fail the whole cart section load.</text>
<line x1="888" y1="482" x2="888" y2="517" stroke="#d6fa00" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="620" y="517" width="536" height="156" rx="9" fill="#171d1e" stroke="#d6fa00" stroke-width="1.5"/>
<text x="642" y="549" fill="#d6fa00" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="start">HUMAN · PROPOSED INVESTIGATION</text>
<text x="642" y="586" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Inject a post-quote getData() failure.</text>
<text x="642" y="616" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Check whether the cart section fails.</text>
<text x="642" y="646" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Choose an optional-feature fallback.</text>
<line x1="888" y1="673" x2="888" y2="709" stroke="#3b4648" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="620" y="709" width="536" height="139" rx="9" fill="#171d1e" stroke="#3b4648" stroke-width="1.5"/>
<text x="642" y="747" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">If confirmed, isolate the failure.</text>
<text x="642" y="778" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Keep cart data when the bar fails.</text>
<text x="642" y="809" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Add a regression for the exception.</text>
<text x="44" y="893" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Warning and Minor are Dispatch&#x27;s labels. Two of four open threads are shown.</text>
