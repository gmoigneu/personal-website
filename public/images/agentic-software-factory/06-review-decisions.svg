<text x="66" y="747" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">If confirmed, align eligibility.</text>
<text x="66" y="778" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Test configured tax modes and limits.</text>
<text x="66" y="809" fill="#f4f5f2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Record checks for the revised change.</text>
<text x="621" y="314" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start">DISPATCH LABEL · MINOR</text>
