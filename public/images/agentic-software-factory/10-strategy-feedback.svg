<text x="62" y="847" fill="#d6fa00" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="start">Continue</text>
<text x="62" y="879" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Keep the change</text>
<line x1="458" y1="775" x2="458" y2="810" stroke="#d6fa00" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="328" y="810" width="260" height="96" rx="9" fill="#171d1e" stroke="#d6fa00" stroke-width="1.5"/>
<text x="346" y="847" fill="#d6fa00" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="start">Change</text>
<text x="346" y="879" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Revise the hypothesis</text>
<line x1="742" y1="775" x2="742" y2="810" stroke="#d6fa00" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="612" y="810" width="260" height="96" rx="9" fill="#171d1e" stroke="#d6fa00" stroke-width="1.5"/>
<text x="630" y="847" fill="#d6fa00" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="start">Stop</text>
<text x="630" y="879" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">End the investment</text>
<line x1="1026" y1="775" x2="1026" y2="810" stroke="#d6fa00" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="896" y="810" width="260" height="96" rx="9" fill="#171d1e" stroke="#d6fa00" stroke-width="1.5"/>
<text x="914" y="847" fill="#d6fa00" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="start">Inconclusive</text>
<text x="914" y="879" fill="#b0babc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Gather more evidence</text>
