<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
<title id="title">Expand in four directions</title><desc id="desc">Use the coding agent as the starting point for wider AI investment.</desc>
